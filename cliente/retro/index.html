<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Torre</title>
<!--
  Cliente 3D de La Torre: estética 3D retro de 64 bits (low-poly, niebla, sombra redonda)
  con texturas generadas en alta resolución. Todos los modelos y texturas se generan por
  código: no usa assets de terceros.
  El cliente no decide nada: manda acciones y dibuja el snapshot del servidor autoritativo.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --oro: #d8b46a; --oro-tenue: #8c7444; --sangre: #a3231b; --vida: #b3261e; --stamina: #4e8f3a;
          --panel: rgba(12, 10, 14, .82); --texto: #e9e2d2; --tenue: #9a9187; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07060a; color: var(--texto); overflow: hidden;
               font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  #lienzo { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #lienzo.pixelado { image-rendering: pixelated; }
  .titulo { font-family: Cinzel, Georgia, serif; letter-spacing: .12em; }
  .oculto { display: none !important; }

  /* Pantalla de inicio */
  #inicio { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 18px; background: radial-gradient(ellipse at center, rgba(0,0,0,.15), rgba(0,0,0,.75)); }
  #inicio h1 { margin: 0; font-size: clamp(42px, 8vw, 88px); color: var(--oro); text-shadow: 0 0 24px rgba(216,180,106,.25); }
  #inicio p { margin: 0; color: var(--tenue); }
  .formulario { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 14px;
                background: var(--panel); border: 1px solid #3a3024; border-radius: 4px; }
  input, select, button { background: #15121a; color: var(--texto); border: 1px solid #3a3024; border-radius: 3px;
                          padding: 7px 10px; font: inherit; }
  button { cursor: pointer; font-family: Cinzel, Georgia, serif; letter-spacing: .08em; }
  button:hover { border-color: var(--oro); color: var(--oro); }

  /* HUD del jugador */
  #hud { position: fixed; left: 20px; top: 18px; width: min(360px, 60vw); pointer-events: none; }
  .barra { height: 12px; background: rgba(0,0,0,.6); border: 1px solid #3a3024; margin: 4px 0 8px; position: relative; }
  .barra > div { position: absolute; inset: 0 auto 0 0; transition: width .12s linear; }
  .barra .eco { background: #e9e2d2; opacity: .35; transition: width .6s ease-out .25s; }
  #aliados { font-size: 12px; color: var(--tenue); }
  #aliados .barra { height: 6px; margin: 2px 0 6px; }

  /* Jefe (abajo, al centro) */
  #hudJefe { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); width: min(720px, 86vw);
             pointer-events: none; text-align: left; }
  #hudJefe .nombre { font-size: 18px; color: var(--texto); text-shadow: 0 1px 2px #000; }
  #hudJefe .barra { height: 10px; }
  #hudJefe .fases { font-size: 12px; color: var(--tenue); float: right; }

  #info { position: fixed; right: 18px; top: 16px; text-align: right; color: var(--tenue); font-size: 12px; pointer-events: none; }
  #info .piso { font-family: Cinzel, Georgia, serif; font-size: 16px; color: var(--oro); }
  #ayuda { position: fixed; right: 18px; bottom: 14px; color: #6f675e; font-size: 12px; text-align: right; pointer-events: none; }
  #eventos { position: fixed; left: 20px; top: 110px; width: 340px; font-size: 13px; pointer-events: none;
             display: flex; flex-direction: column; gap: 2px; }
  #eventos div { color: #c9c0b2; text-shadow: 0 1px 2px #000; animation: desvanecer 6s forwards; }
  @keyframes desvanecer { 0%, 70% { opacity: 1 } 100% { opacity: 0 } }

  /* Mensajes grandes y capas */
  #banner { position: fixed; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; opacity: 0;
            transition: opacity .8s; }
  #banner.visible { opacity: 1; }
  #banner .grande { font-size: clamp(30px, 6vw, 64px); }
  #banner .chico { color: var(--tenue); font-size: 16px; margin-top: 6px; }
  #banner .franja { background: linear-gradient(90deg, transparent, rgba(0,0,0,.7) 20%, rgba(0,0,0,.7) 80%, transparent);
                    padding: 18px 0; }
  #capa { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
          gap: 16px; text-align: center; background: rgba(5, 4, 8, .55); }
  #capa h2 { margin: 0; color: var(--oro); font-size: 30px; }
  .cartas { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .carta { width: 190px; padding: 18px 14px; background: var(--panel); border: 1px solid #3a3024; cursor: pointer;
           transition: transform .12s, border-color .12s; }
  .carta:hover { transform: translateY(-4px); border-color: var(--oro); }
  .carta b { display: block; font-family: Cinzel, Georgia, serif; color: var(--oro); font-size: 16px; margin-bottom: 8px; }
  .carta small { color: var(--tenue); }
  .carta .tecla { color: #6f675e; font-size: 12px; margin-top: 10px; display: block; }
  kbd { background: #1b1720; border: 1px solid #3a3024; border-radius: 3px; padding: 0 5px; font-size: 12px; }

  #numeros { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .numero { position: absolute; font-family: Cinzel, Georgia, serif; font-weight: 700; font-size: 20px;
            text-shadow: 0 2px 3px #000; transform: translate(-50%, -50%); }
  #error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="lienzo"></canvas>

<div id="inicio">
  <h1 class="titulo">LA TORRE</h1>
  <p>Cuatro jefes. Una subida. Ninguna segunda oportunidad.</p>
  <div class="formulario">
    <input id="url" value="ws://localhost:7654" size="20" aria-label="Servidor">
    <input id="nombre" placeholder="tu nombre" size="12" maxlength="24" aria-label="Nombre">
    <select id="rol" aria-label="Rol"><option value="jugador">Jugador</option><option value="espectador">Espectador</option></select>
    <button id="botonEntrar">Entrar</button>
  </div>
  <p id="estadoConexion">&nbsp;</p>
</div>

<div id="hud" class="oculto">
  <div class="titulo" id="miNombre"></div>
  <div class="barra"><div class="eco" id="ecoVida"></div><div id="barraVida" style="background:var(--vida)"></div></div>
  <div class="barra" style="height:8px"><div id="barraStamina" style="background:var(--stamina)"></div></div>
  <div id="aliados"></div>
</div>
<div id="hudJefe" class="oculto">
  <span class="nombre titulo" id="nombreJefe"></span><span class="fases" id="fasesJefe"></span>
  <div class="barra"><div class="eco" id="ecoJefe"></div><div id="barraJefe" style="background:var(--sangre)"></div></div>
</div>
<div id="info" class="oculto"><div class="piso" id="piso"></div><div id="detalle"></div></div>
<div id="eventos"></div>
<div id="ayuda" class="oculto">
  <kbd>W A S D</kbd> mover (fijado al jefe) · <kbd>J</kbd>/clic atacar · <kbd>Espacio</kbd> esquivar<br>
  <kbd>Enter</kbd> listo · <kbd>1 2 3</kbd> mejora · <kbd>P</kbd> pixelado · <kbd>M</kbd> sonido
</div>
<div id="banner"><div class="franja"><div class="grande titulo" id="bannerGrande"></div><div class="chico" id="bannerChico"></div></div></div>
<div id="capa" class="oculto"></div>
<div id="numeros"></div>

<script type="module">
import * as THREE from "three";

// =====================================================================================
//  Constantes y utilidades
// =====================================================================================
const ARENA = 20, MITAD = ARENA / 2, TICK_MS = 50;
const COLORES_JUGADOR = [0x9b2c2c, 0x2c5f9b, 0x6a3c8f, 0x3c7a3c];
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const limitar = (v, a, b) => Math.max(a, Math.min(b, v));
const suave = (t) => t * t * (3 - 2 * t);
const salida = (t) => 1 - (1 - t) * (1 - t);
const lerp = (a, b, t) => a + (b - a) * t;
// El servidor usa un plano (x, y) de 0 a 20 con el jefe hacia +y; en 3D: X = x - 10, Z = 10 - y
const mundo = (x, y, alto = 0) => new THREE.Vector3(x - MITAD, alto, MITAD - y);
const giroHacia = (dx, dy) => Math.atan2(dx, -dy);           // los modelos miran a +Z local
function lerpAngulo(a, b, t) {
  const d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  return a + d * t;
}
function azar(semilla) {                                       // generador reproducible (mulberry32)
  return () => {
    semilla |= 0; semilla = (semilla + 0x6d2b79f5) | 0;
    let t = Math.imul(semilla ^ (semilla >>> 15), 1 | semilla);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// =====================================================================================
//  Render, escena, niebla y luces
// =====================================================================================
const lienzo = $("lienzo");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: lienzo, antialias: true }); }
catch (e) {
  document.body.innerHTML = `<div id="error">Tu navegador no pudo iniciar WebGL.<br>Prueba el cliente 2D en cliente/prueba2d.</div>`;
  throw e;
}
let modoPixelado = false;
function ajustarTamano() {
  renderer.setPixelRatio(modoPixelado ? 0.38 : Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  camara.aspect = innerWidth / innerHeight;
  camara.updateProjectionMatrix();
}
const escena = new THREE.Scene();
const COLOR_NIEBLA = 0x0b0910;
escena.background = new THREE.Color(COLOR_NIEBLA);
escena.fog = new THREE.Fog(COLOR_NIEBLA, 16, 42);              // la niebla esconde el fondo, como en los 90
const camara = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 120);
camara.position.set(0, 9, 18);
ajustarTamano();
addEventListener("resize", ajustarTamano);

escena.add(new THREE.HemisphereLight(0x7d7290, 0x1b1418, 1.1));
const luna = new THREE.DirectionalLight(0x8090c0, 0.7);
luna.position.set(-6, 14, 4);
escena.add(luna);

// =====================================================================================
//  Texturas generadas en alta resolución (sin descargar nada)
// =====================================================================================
const anisotropia = renderer.capabilities.getMaxAnisotropy();
function textura(tam, dibujar, repetir = 1) {
  const c = document.createElement("canvas");
  c.width = c.height = tam;
  dibujar(c.getContext("2d"), tam);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = anisotropia;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repetir, repetir);
  return t;
}
function ruido(g, tam, cantidad, rnd, claro = 0.08, oscuro = 0.12) {
  for (let i = 0; i < cantidad; i++) {
    const x = rnd() * tam, y = rnd() * tam, s = 1 + rnd() * 3;
    g.fillStyle = rnd() < 0.5 ? `rgba(255,255,255,${rnd() * claro})` : `rgba(0,0,0,${rnd() * oscuro})`;
    g.fillRect(x, y, s, s);
  }
}
function texturaLosas(repetir) {
  return textura(1024, (g, tam) => {
    const rnd = azar(7), n = 8, lado = tam / n;
    g.fillStyle = "#121014"; g.fillRect(0, 0, tam, tam);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const x = i * lado + 3, y = j * lado + 3, w = lado - 6, h = lado - 6, l = 20 + rnd() * 10;
      g.fillStyle = `hsl(${25 + rnd() * 15}, ${6 + rnd() * 6}%, ${l}%)`;
      g.fillRect(x, y, w, h);
      g.fillStyle = "rgba(255,255,255,0.06)"; g.fillRect(x, y, w, 3); g.fillRect(x, y, 3, h);   // bisel
      g.fillStyle = "rgba(0,0,0,0.25)"; g.fillRect(x, y + h - 4, w, 4); g.fillRect(x + w - 4, y, 4, h);
      if (rnd() < 0.35) {                                                // grieta
        g.strokeStyle = "rgba(0,0,0,0.55)"; g.lineWidth = 1.5; g.beginPath();
        let cx = x + rnd() * w, cy = y + rnd() * h; g.moveTo(cx, cy);
        for (let k = 0; k < 5; k++) { cx += (rnd() - 0.5) * 50; cy += (rnd() - 0.5) * 50; g.lineTo(cx, cy); }
        g.stroke();
      }
      if (rnd() < 0.2) {                                                 // mancha oscura
        const gr = g.createRadialGradient(x + w / 2, y + h / 2, 2, x + w / 2, y + h / 2, w * 0.6);
        gr.addColorStop(0, "rgba(10,5,5,0.45)"); gr.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = gr; g.fillRect(x, y, w, h);
      }
    }
    ruido(g, tam, 60000, rnd);
  }, repetir);
}
function texturaLadrillo(repetir) {
  return textura(1024, (g, tam) => {
    const rnd = azar(11), filas = 16, alto = tam / filas;
    g.fillStyle = "#0e0c10"; g.fillRect(0, 0, tam, tam);
    for (let f = 0; f < filas; f++) {
      const desfase = f % 2 ? 64 : 0;
      for (let x = -desfase; x < tam; x += 128) {
        g.fillStyle = `hsl(${20 + rnd() * 20}, 7%, ${17 + rnd() * 9}%)`;
        g.fillRect(x + 3, f * alto + 3, 122, alto - 6);
        g.fillStyle = "rgba(255,255,255,0.05)"; g.fillRect(x + 3, f * alto + 3, 122, 3);
      }
    }
    ruido(g, tam, 50000, rnd);
  }, repetir);
}
const texMetal = textura(512, (g, tam) => {
  const rnd = azar(3);
  g.fillStyle = "#b9b9bd"; g.fillRect(0, 0, tam, tam);
  ruido(g, tam, 30000, rnd, 0.12, 0.16);
  g.strokeStyle = "rgba(255,255,255,0.18)"; g.lineWidth = 1;            // arañazos
  for (let i = 0; i < 90; i++) {
    const x = rnd() * tam, y = rnd() * tam, l = 10 + rnd() * 40, a = rnd() * Math.PI;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
});
const texTela = textura(512, (g, tam) => {
  const rnd = azar(5);
  g.fillStyle = "#c8c8c8"; g.fillRect(0, 0, tam, tam);
  for (let y = 0; y < tam; y += 3) { g.fillStyle = `rgba(0,0,0,${0.04 + rnd() * 0.05})`; g.fillRect(0, y, tam, 1); }
  for (let x = 0; x < tam; x += 3) { g.fillStyle = `rgba(0,0,0,${0.03 + rnd() * 0.04})`; g.fillRect(x, 0, 1, tam); }
  ruido(g, tam, 15000, rnd);
});
const texSombra = (() => {                                       // sombra redonda bajo cada personaje
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"), gr = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  gr.addColorStop(0, "rgba(0,0,0,0.75)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();

// =====================================================================================
//  Materiales y piezas
// =====================================================================================
function mat(color, extra = {}) {
  return new THREE.MeshPhongMaterial({ color, flatShading: true, shininess: 10, specular: 0x222222, ...extra });
}
function pieza(geo, material, x = 0, y = 0, z = 0, padre = null) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  if (padre) padre.add(m);
  return m;
}
function sombraRedonda(radio) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(radio * 2.6, radio * 2.6),
    new THREE.MeshBasicMaterial({ map: texSombra, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.02;
  return m;
}

// =====================================================================================
//  La arena
// =====================================================================================
const llamas = [];                       // braseros: luz que parpadea + llamas que bailan
(function construirArena() {
  const piedra = mat(0xffffff, { map: texturaLosas(2.5), shininess: 4 });
  const suelo = pieza(new THREE.PlaneGeometry(ARENA, ARENA), piedra);
  suelo.rotation.x = -Math.PI / 2; escena.add(suelo);
  const fuera = pieza(new THREE.PlaneGeometry(90, 90), mat(0x55505a, { map: texturaLosas(11), shininess: 2 }), 0, -0.02, 0);
  fuera.rotation.x = -Math.PI / 2; escena.add(fuera);

  // Sello dorado en el centro de la arena
  const sello = pieza(new THREE.RingGeometry(3.2, 3.35, 64),
    new THREE.MeshBasicMaterial({ color: 0x8c7444, transparent: true, opacity: 0.35 }), 0, 0.015, 0);
  sello.rotation.x = -Math.PI / 2; escena.add(sello);
  const sello2 = sello.clone(); sello2.geometry = new THREE.RingGeometry(2.2, 2.26, 6); escena.add(sello2);

  const ladrillo = texturaLadrillo(1), muro = mat(0xffffff, { map: ladrillo });
  const rnd = azar(21);
  // Muro bajo alrededor
  for (const [x, z, w, d] of [[0, -10.35, 21, 0.5], [0, 10.35, 21, 0.5], [-10.35, 0, 0.5, 21], [10.35, 0, 0.5, 21]]) {
    escena.add(pieza(new THREE.BoxGeometry(w, 0.7, d), muro, x, 0.35, z));
  }
  // Columnas alrededor, algunas rotas
  for (let i = -2; i <= 2; i++) {
    for (const [x, z] of [[i * 5, -11.4], [i * 5, 11.4], [-11.4, i * 5], [11.4, i * 5]]) {
      if (Math.abs(x) === 10 && Math.abs(z) === 11.4) continue;
      const alto = rnd() < 0.3 ? 1.5 + rnd() * 1.5 : 5 + rnd() * 2;
      const col = pieza(new THREE.CylinderGeometry(0.5, 0.6, alto, 6), muro, x, alto / 2, z);
      if (alto < 4) col.rotation.z = (rnd() - 0.5) * 0.15;
      escena.add(col);
      escena.add(pieza(new THREE.BoxGeometry(1.4, 0.3, 1.4), muro, x, 0.15, z));
    }
  }
  // Puerta del fondo (por donde aparece cada jefe)
  const puerta = new THREE.Group(); puerta.position.set(0, 0, -13);
  pieza(new THREE.BoxGeometry(1.2, 8, 1.2), muro, -2.6, 4, 0, puerta);
  pieza(new THREE.BoxGeometry(1.2, 8, 1.2), muro, 2.6, 4, 0, puerta);
  pieza(new THREE.BoxGeometry(6.6, 1.2, 1.4), muro, 0, 8.4, 0, puerta);
  pieza(new THREE.PlaneGeometry(4, 7.8), new THREE.MeshBasicMaterial({ color: 0x1a0d22 }), 0, 3.9, 0.1, puerta);
  escena.add(puerta);
  // Estandartes rasgados
  const tela = mat(0x5a1414, { map: texTela, side: THREE.DoubleSide });
  for (const x of [-7.5, 7.5]) {
    const est = pieza(new THREE.PlaneGeometry(1.3, 3.2, 1, 4), tela, x, 3.2, -11.35);
    const pos = est.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) if (pos.getY(i) < -1.5) pos.setY(i, pos.getY(i) + (i % 2 ? 0.35 : 0));
    escena.add(est);
  }
  // Fondo lejano: un muro circular que se pierde en la niebla
  const fondo = pieza(new THREE.CylinderGeometry(34, 34, 30, 24, 1, true), mat(0x3a3540, { map: texturaLadrillo(6), side: THREE.BackSide }), 0, 12, 0);
  escena.add(fondo);
  // Braseros en las esquinas
  for (const [x, z] of [[-9.6, -9.6], [9.6, -9.6], [-9.6, 9.6], [9.6, 9.6]]) {
    const b = new THREE.Group(); b.position.set(x, 0, z);
    pieza(new THREE.CylinderGeometry(0.25, 0.4, 1.4, 6), muro, 0, 0.7, 0, b);
    pieza(new THREE.CylinderGeometry(0.6, 0.35, 0.35, 6), mat(0x3a3028, { map: texMetal }), 0, 1.55, 0, b);
    const fuego = new THREE.Group(); fuego.position.y = 1.75; b.add(fuego);
    const fuegoMat = new THREE.MeshBasicMaterial({ color: 0xff8a2a, transparent: true, opacity: 0.9 });
    for (let k = 0; k < 3; k++) {
      const llama = pieza(new THREE.ConeGeometry(0.28 - k * 0.07, 0.8 - k * 0.15, 5), fuegoMat, (k - 1) * 0.12, 0.35, (k % 2) * 0.1, fuego);
      llama.userData.fase = k * 2.1;
    }
    const luz = new THREE.PointLight(0xff8a3a, 22, 18, 1.6);
    luz.position.y = 2.2; b.add(luz);
    llamas.push({ fuego, luz, fase: x * z });
    escena.add(b);
  }
})();

// =====================================================================================
//  Partículas (chispas, ceniza y polvo) con un solo sistema reutilizable
// =====================================================================================
const MAX_PARTICULAS = 900;
const particulas = (() => {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(MAX_PARTICULAS * 3), col = new Float32Array(MAX_PARTICULAS * 3);
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const puntos = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.12, vertexColors: true, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending }));
  puntos.frustumCulled = false;
  escena.add(puntos);
  const vivas = [];                                   // { i, vx, vy, vz, vida, max, gravedad, color }
  let siguiente = 0;
  for (let i = 0; i < MAX_PARTICULAS; i++) pos[i * 3 + 1] = -100;
  return {
    emitir(origen, cantidad, color, rapidez = 3, opciones = {}) {
      const c = new THREE.Color(color);
      for (let n = 0; n < cantidad; n++) {
        const i = siguiente; siguiente = (siguiente + 1) % MAX_PARTICULAS;
        const a = Math.random() * Math.PI * 2, e = (opciones.subir ?? 0.6) + Math.random() * 0.8;
        const r = opciones.radio ?? 0;
        pos[i * 3] = origen.x + Math.cos(a) * r * Math.random();
        pos[i * 3 + 1] = origen.y;
        pos[i * 3 + 2] = origen.z + Math.sin(a) * r * Math.random();
        vivas.push({ i, vx: Math.cos(a) * rapidez * Math.random(), vy: e * rapidez, vz: Math.sin(a) * rapidez * Math.random(),
                     vida: 0, max: (opciones.vida ?? 0.8) * (0.6 + Math.random() * 0.6), gravedad: opciones.gravedad ?? 6, c });
      }
    },
    actualizar(dt) {
      for (let k = vivas.length - 1; k >= 0; k--) {
        const p = vivas[k]; p.vida += dt;
        const i = p.i, f = 1 - p.vida / p.max;
        if (f <= 0) { pos[i * 3 + 1] = -100; vivas.splice(k, 1); continue; }
        p.vy -= p.gravedad * dt;
        pos[i * 3] += p.vx * dt; pos[i * 3 + 1] = Math.max(0.03, pos[i * 3 + 1] + p.vy * dt); pos[i * 3 + 2] += p.vz * dt;
        col[i * 3] = p.c.r * f; col[i * 3 + 1] = p.c.g * f; col[i * 3 + 2] = p.c.b * f;
      }
      geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true;
    },
  };
})();

// Ondas de choque en el suelo cuando cae un golpe del jefe
const ondas = [];
function onda(x, z, radio, color = 0xff5a2a) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.85, 1, 48),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, 0.05, z);
  escena.add(m);
  ondas.push({ m, t: 0, radio });
}
function actualizarOndas(dt) {
  for (let k = ondas.length - 1; k >= 0; k--) {
    const o = ondas[k]; o.t += dt;
    const p = o.t / 0.45, s = o.radio * (0.3 + 0.9 * salida(Math.min(1, p)));
    o.m.scale.set(s, s, s); o.m.material.opacity = 0.9 * (1 - p);
    if (p >= 1) { escena.remove(o.m); o.m.geometry.dispose(); o.m.material.dispose(); ondas.splice(k, 1); }
  }
}

// =====================================================================================
//  El caballero (low-poly, generado por código)
// =====================================================================================
function crearCaballero(color) {
  // Jerarquía: raiz → giro (cintura, para la voltereta) → cuerpo → piernas (muslo → rodilla)
  //                                                             → pecho (torso) → cuello, brazos (hombro → codo), capa
  const raiz = new THREE.Group(), giro = new THREE.Group(), cuerpo = new THREE.Group();
  giro.position.y = 0.6; cuerpo.position.y = -0.6;
  raiz.add(giro); giro.add(cuerpo);
  const acero = mat(0xaab0b8, { map: texMetal, shininess: 40, specular: 0x555555 });
  const tinte = mat(color, { map: texTela });
  const oscuro = mat(0x24202a);
  const hoja = mat(0xd8dde4, { shininess: 90, specular: 0xaaaaaa, emissive: 0x111418 });
  const capaMat = mat(new THREE.Color(color).multiplyScalar(0.55).getHex(), { map: texTela, side: THREE.DoubleSide });
  const mats = [acero, tinte, oscuro, hoja, capaMat];

  // Piernas con rodilla
  const piernas = [-1, 1].map((s) => {
    const muslo = new THREE.Group(); muslo.position.set(s * 0.13, 0.56, 0); cuerpo.add(muslo);
    pieza(new THREE.BoxGeometry(0.17, 0.29, 0.2), acero, 0, -0.14, 0, muslo);
    const rodilla = new THREE.Group(); rodilla.position.y = -0.28; muslo.add(rodilla);
    pieza(new THREE.BoxGeometry(0.15, 0.24, 0.18), acero, 0, -0.12, 0, rodilla);
    pieza(new THREE.BoxGeometry(0.16, 0.07, 0.06), acero, 0, 0, 0.09, rodilla);        // rodillera
    pieza(new THREE.BoxGeometry(0.19, 0.08, 0.28), oscuro, 0, -0.25, 0.04, rodilla);   // bota
    return { muslo, rodilla };
  });

  // Torso (gira y se inclina por separado de las piernas)
  const pecho = new THREE.Group(); pecho.position.y = 0.62; cuerpo.add(pecho);
  pieza(new THREE.CylinderGeometry(0.31, 0.31, 0.09, 6), oscuro, 0, -0.02, 0, pecho);
  pieza(new THREE.CylinderGeometry(0.25, 0.3, 0.55, 6), acero, 0, 0.26, 0, pecho);
  pieza(new THREE.BoxGeometry(0.34, 0.55, 0.06), tinte, 0, 0.16, 0.27, pecho);
  const cuello = new THREE.Group(); cuello.position.y = 0.55; pecho.add(cuello);
  const cabeza = pieza(new THREE.CylinderGeometry(0.18, 0.21, 0.32, 6), acero, 0, 0.16, 0, cuello);
  pieza(new THREE.BoxGeometry(0.28, 0.04, 0.06), mat(0x050505), 0, 0.02, 0.18, cabeza);
  const penacho = pieza(new THREE.ConeGeometry(0.07, 0.4, 4), tinte, 0, 0.3, -0.06, cabeza);
  penacho.rotation.x = -0.5;
  for (const s of [-1, 1]) pieza(new THREE.BoxGeometry(0.2, 0.13, 0.28), acero, s * 0.33, 0.5, 0, pecho);

  // Brazos con codo; la espada va en la mano derecha y el escudo en el antebrazo izquierdo
  const brazo = (s) => {
    const hombro = new THREE.Group(); hombro.position.set(s * 0.37, 0.45, 0); pecho.add(hombro);
    pieza(new THREE.BoxGeometry(0.12, 0.23, 0.14), acero, 0, -0.11, 0, hombro);
    const codo = new THREE.Group(); codo.position.y = -0.22; hombro.add(codo);
    pieza(new THREE.BoxGeometry(0.11, 0.21, 0.13), acero, 0, -0.1, 0, codo);
    const mano = new THREE.Group(); mano.position.y = -0.21; codo.add(mano);
    return { hombro, codo, mano };
  };
  const brazoD = brazo(1), brazoI = brazo(-1);
  const espada = new THREE.Group(); espada.position.set(0, 0, 0.04); espada.rotation.x = Math.PI / 2; brazoD.mano.add(espada);
  pieza(new THREE.BoxGeometry(0.045, 0.16, 0.045), oscuro, 0, 0, 0, espada);
  pieza(new THREE.BoxGeometry(0.28, 0.045, 0.07), acero, 0, 0.09, 0, espada);
  pieza(new THREE.BoxGeometry(0.075, 0.95, 0.02), hoja, 0, 0.58, 0, espada);
  pieza(new THREE.ConeGeometry(0.038, 0.12, 4), hoja, 0, 1.11, 0, espada);
  const punta = new THREE.Object3D(); punta.position.y = 1.15; espada.add(punta);      // para la estela
  const base = new THREE.Object3D(); base.position.y = 0.35; espada.add(base);
  const escudo = pieza(new THREE.CylinderGeometry(0.3, 0.3, 0.06, 6), tinte, -0.05, -0.08, 0.16, brazoI.codo);
  escudo.rotation.x = Math.PI / 2;
  pieza(new THREE.CylinderGeometry(0.33, 0.33, 0.04, 6), acero, 0, -0.02, 0, escudo);

  // Capa en 3 segmentos encadenados: cada uno sigue al anterior con retraso (movimiento secundario)
  const capa = [];
  let ancla = new THREE.Group(); ancla.position.set(0, 0.55, -0.27); pecho.add(ancla);
  for (let i = 0; i < 3; i++) {
    const seg = new THREE.Group();
    if (i > 0) seg.position.y = -0.32;
    ancla.add(seg);
    pieza(new THREE.PlaneGeometry(0.62 - i * 0.04, 0.33), capaMat, 0, -0.16, 0, seg);
    capa.push(seg); ancla = seg;
  }

  // Estela de la espada: una cinta que sigue la hoja durante el tajo
  const N = 14;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(N * 2 * 3), 3));
  geo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(N * 2 * 3), 3));
  const indices = [];
  for (let i = 0; i < N - 1; i++) { const a = i * 2; indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  geo.setIndex(indices);
  const estela = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, side: THREE.DoubleSide,
    depthWrite: false, blending: THREE.AdditiveBlending }));
  estela.frustumCulled = false;
  raiz.add(estela);

  raiz.add(sombraRedonda(0.5));
  return { raiz, giro, cuerpo, pecho, cuello, piernas, brazoD, brazoI, capa, punta, base,
           estela: { malla: estela, puntos: [], N }, mats, tipo: "caballero" };
}

// =====================================================================================
//  Los jefes (diseños originales, low-poly, generados por código)
// =====================================================================================
function crearJefe(id) {
  const raiz = new THREE.Group(), giro = new THREE.Group(); raiz.add(giro);
  const arma = new THREE.Group();          // la pieza que se alza al preparar un ataque
  const ojos = [], mats = [], piernas = [];
  let cabeza = null, capa = null, cuadrupedo = false;
  const m = (color, extra) => { const x = mat(color, extra); mats.push(x); return x; };
  const brillo = (color) => { const x = new THREE.MeshBasicMaterial({ color }); ojos.push(x); return x; };
  // pierna articulada en la cadera: la caja cuelga del pivote para poder caminar
  const pierna = (x, z, alto, ancho, fondo, material) => {
    const p = new THREE.Group(); p.position.set(x, alto, z); giro.add(p);
    pieza(new THREE.BoxGeometry(ancho, alto, fondo), material, 0, -alto / 2, 0, p);
    piernas.push(p); return p;
  };
  const cuello = (y, z = 0) => { const c = new THREE.Group(); c.position.set(0, y, z); giro.add(c); cabeza = c; return c; };
  let reposo = -0.3, alzado = -3.3, golpe = -0.6;   // ángulos del arma (eje X)

  if (id === "guardian") {                         // Guardián de Hierro: gólem acorazado con martillo
    const hierro = m(0x7a6250, { map: texMetal, shininess: 30 }), oscuro = m(0x2c2522);
    for (const s of [-1, 1]) pierna(s * 0.35, 0, 0.85, 0.38, 0.42, hierro);
    pieza(new THREE.BoxGeometry(1.35, 1.0, 0.85), hierro, 0, 1.35, 0, giro);
    pieza(new THREE.BoxGeometry(1.0, 0.6, 0.12), oscuro, 0, 1.4, 0.45, giro);
    const c = cuello(1.85, 0.05);
    pieza(new THREE.BoxGeometry(0.48, 0.42, 0.48), hierro, 0, 0.21, 0, c);
    pieza(new THREE.BoxGeometry(0.36, 0.06, 0.05), brillo(0xff7a1a), 0, 0.21, 0.25, c);
    for (const s of [-1, 1]) {
      const h = pieza(new THREE.BoxGeometry(0.6, 0.36, 0.75), hierro, s * 0.88, 1.8, 0, giro); h.rotation.z = s * -0.2;
    }
    pieza(new THREE.BoxGeometry(0.32, 0.95, 0.32), hierro, -0.88, 1.1, 0.05, giro);
    arma.position.set(0.88, 1.65, 0);
    pieza(new THREE.BoxGeometry(0.32, 0.85, 0.32), hierro, 0, -0.4, 0, arma);
    const martillo = new THREE.Group(); martillo.position.set(0, -0.85, 0); martillo.rotation.x = Math.PI / 2; arma.add(martillo);
    pieza(new THREE.CylinderGeometry(0.06, 0.06, 1.7, 6), oscuro, 0, 0.6, 0, martillo);
    pieza(new THREE.BoxGeometry(0.7, 0.5, 0.5), hierro, 0, 1.45, 0, martillo);
  } else if (id === "bruja") {                     // Bruja de Ceniza: túnica flotante y báculo ardiente
    const ceniza = m(0x4d464c, { map: texTela }), oscuro = m(0x16121a);
    capa = pieza(new THREE.ConeGeometry(0.8, 1.9, 7), ceniza, 0, 0.95, 0, giro);        // la túnica se mece
    pieza(new THREE.CylinderGeometry(0.33, 0.55, 0.45, 7), ceniza, 0, 1.75, 0, giro);
    const c = cuello(1.95, -0.04);
    const capucha = pieza(new THREE.ConeGeometry(0.34, 0.7, 6), ceniza, 0, 0.25, 0, c);
    pieza(new THREE.BoxGeometry(0.26, 0.26, 0.06), oscuro, 0, -0.18, 0.2, capucha);
    for (const s of [-1, 1]) pieza(new THREE.BoxGeometry(0.05, 0.03, 0.03), brillo(0xff9a3a), s * 0.06, -0.14, 0.24, capucha);
    arma.position.set(0.5, 1.6, 0.1);
    pieza(new THREE.ConeGeometry(0.12, 0.6, 5), ceniza, 0, -0.25, 0, arma);
    pieza(new THREE.CylinderGeometry(0.03, 0.03, 2.3, 5), oscuro, 0, 0.0, 0.15, arma);
    pieza(new THREE.IcosahedronGeometry(0.17, 0), brillo(0xff8a2a), 0, 1.15, 0.15, arma);
    const luz = new THREE.PointLight(0xff7a2a, 6, 7, 1.6); luz.position.set(0, 1.15, 0.15); arma.add(luz);
    reposo = 0; alzado = -1.4; golpe = 0.5;
  } else if (id === "sabueso") {                   // Sabueso Abismal: bestia de cuatro patas
    cuadrupedo = true;
    const piel = m(0x2b2238, { map: texTela }), hueso = m(0xb8ad98);
    pieza(new THREE.BoxGeometry(0.85, 0.62, 1.6), piel, 0, 0.85, 0, giro);
    for (let k = 0; k < 5; k++) { const p = pieza(new THREE.ConeGeometry(0.08, 0.35, 4), hueso, 0, 1.25, -0.6 + k * 0.3, giro); p.rotation.x = -0.4; }
    for (const [x, z] of [[-0.3, 0.6], [0.3, -0.6], [0.3, 0.6], [-0.3, -0.6]]) pierna(x, z, 0.7, 0.18, 0.2, piel);  // pares diagonales
    capa = pieza(new THREE.ConeGeometry(0.08, 0.8, 4), piel, 0, 1.0, -1.1, giro); capa.rotation.x = -1.9;      // la cola
    arma.position.set(0, 1.05, 0.85);              // la cabeza hace de "arma"
    const craneo = pieza(new THREE.ConeGeometry(0.32, 0.8, 5), hueso, 0, 0, 0.35, arma); craneo.rotation.x = Math.PI / 2;
    for (const s of [-1, 1]) pieza(new THREE.BoxGeometry(0.07, 0.05, 0.05), brillo(0xa66bff), s * 0.13, 0.1, 0.35, arma);
    for (const s of [-1, 1]) { const c = pieza(new THREE.ConeGeometry(0.05, 0.4, 4), hueso, s * 0.2, 0.25, 0.05, arma); c.rotation.x = -0.6; }
    reposo = 0; alzado = -0.5; golpe = 0.35;
  } else if (id === "rey") {                       // Rey sin Corona: espadón y corona rota
    const oro = m(0x7f6a38, { map: texMetal, shininess: 50 }), palido = m(0xb6ab9b), capaM = m(0x4a0f14, { map: texTela, side: THREE.DoubleSide });
    for (const s of [-1, 1]) pierna(s * 0.2, 0, 1.15, 0.22, 0.26, oro);
    pieza(new THREE.CylinderGeometry(0.38, 0.27, 0.95, 6), oro, 0, 1.6, 0, giro);
    const ancla = new THREE.Group(); ancla.position.set(0, 2.1, -0.32); giro.add(ancla);
    pieza(new THREE.PlaneGeometry(0.9, 1.9, 1, 3), capaM, 0, -0.95, 0, ancla);
    capa = ancla;
    const c = cuello(2.12);
    const cab = pieza(new THREE.CylinderGeometry(0.17, 0.2, 0.36, 6), palido, 0, 0.18, 0, c);
    for (let k = 0; k < 7; k++) {                  // corona incompleta: faltan dos puntas
      if (k === 2 || k === 5) continue;
      const a = (k / 7) * Math.PI * 2, p = pieza(new THREE.ConeGeometry(0.04, 0.2, 4), oro, Math.sin(a) * 0.19, 0.25, Math.cos(a) * 0.19, cab);
      p.rotation.z = k === 4 ? 0.5 : 0;
    }
    for (const s of [-1, 1]) pieza(new THREE.BoxGeometry(0.26, 0.15, 0.32), oro, s * 0.45, 2.05, 0, giro);
    pieza(new THREE.BoxGeometry(0.13, 0.8, 0.15), oro, -0.45, 1.6, 0, giro);
    arma.position.set(0.47, 1.95, 0);
    pieza(new THREE.BoxGeometry(0.13, 0.75, 0.15), oro, 0, -0.35, 0, arma);
    const espadon = new THREE.Group(); espadon.position.set(0, -0.72, 0.05); espadon.rotation.x = Math.PI / 2; arma.add(espadon);
    pieza(new THREE.BoxGeometry(0.4, 0.06, 0.1), oro, 0, 0.1, 0, espadon);
    pieza(new THREE.BoxGeometry(0.14, 1.9, 0.04), m(0xc9ccd2, { shininess: 90, specular: 0x999999 }), 0, 1.1, 0, espadon);
    pieza(new THREE.BoxGeometry(0.03, 1.7, 0.05), brillo(0x8a1a1a), 0, 1.05, 0, espadon);
  } else {                                         // Coloso del Eclipse (jefe del día)
    const roca = m(0x5d5960, { map: texturaLadrillo(1) }), negro = new THREE.MeshBasicMaterial({ color: 0x000000 });
    for (const s of [-1, 1]) pierna(s * 0.45, 0, 1.0, 0.5, 0.55, roca);
    pieza(new THREE.BoxGeometry(1.6, 1.3, 1.0), roca, 0, 1.65, 0, giro);
    const c = cuello(2.3, 0.05);
    const cab = pieza(new THREE.DodecahedronGeometry(0.38, 0), roca, 0, 0.3, 0, c);
    pieza(new THREE.BoxGeometry(0.4, 0.06, 0.05), brillo(0xff3a2a), 0, 0.02, 0.35, cab);
    const halo = pieza(new THREE.TorusGeometry(0.95, 0.07, 6, 28), brillo(0xff6a2a), 0, 2.75, -0.55, giro);
    pieza(new THREE.CircleGeometry(0.88, 28), negro, 0, 0, -0.02, halo);
    capa = halo;                                   // el halo gira despacio
    pieza(new THREE.BoxGeometry(0.45, 1.1, 0.45), roca, -1.05, 1.5, 0, giro);
    arma.position.set(1.05, 2.1, 0);
    pieza(new THREE.BoxGeometry(0.45, 1.0, 0.45), roca, 0, -0.5, 0, arma);
    pieza(new THREE.DodecahedronGeometry(0.42, 0), roca, 0, -1.15, 0, arma);
    reposo = -0.2; alzado = -2.9; golpe = -0.9;
  }
  giro.add(arma);
  raiz.add(sombraRedonda(1));
  arma.rotation.x = reposo;
  return { raiz, giro, arma, ojos, mats, piernas, cabeza, capa, cuadrupedo, reposo, alzado, golpe, tipo: id };
}

// =====================================================================================
//  Estado de red (igual que el cliente 2D) y entidades en la escena
// =====================================================================================
let ws = null, miId = null, miRol = "jugador";
let previo = null, actual = null, tActual = 0, rtt = null, fin = null, elegida = false;
let avisoVisto = null, avisoAnterior = null;
const caballeros = new Map();            // id → { modelo, estadoPrevio, tEstado, ... }
let jefeVista = null;                    // { clave, modelo, ... }
const jefesMuriendo = [];
let sacudida = 0;

function ponerEstado(t) { $("estadoConexion").textContent = t; }
function enviar(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
setInterval(() => enviar({ ping: performance.now() }), 1000);

function conectar() {
  if (ws) { const viejo = ws; viejo.onclose = viejo.onmessage = null; viejo.close(); }
  document.activeElement && document.activeElement.blur();
  iniciarAudio();
  miRol = $("rol").value;
  miId = $("nombre").value.trim() || "caballero" + Math.floor(Math.random() * 1000);
  $("nombre").value = miId;
  previo = actual = null; fin = null; elegida = false; avisoVisto = null;
  vaciarBufer();
  limpiarEntidades();
  ponerEstado("conectando…");
  try { ws = new WebSocket($("url").value.trim()); } catch (e) { ponerEstado("URL inválida"); return; }
  const este = ws;
  ws.onopen = () => este.send(JSON.stringify({ hola: { id: miId, rol: miRol } }));
  ws.onmessage = (m) => {
    const d = JSON.parse(m.data);
    if ("pong" in d) { rtt = performance.now() - d.pong; return; }
    if (d.bienvenida) { mostrarJuego(); return; }
    if ("estado" in d) recibir(d);
  };
  ws.onclose = (e) => {
    if (ws !== este) return;
    ws = null;
    if (!fin) {
      ocultarJuego();
      ponerEstado(`Sin conexión (${e.code}${e.reason ? ": " + e.reason : ""})`);
    }
  };
}
$("botonEntrar").addEventListener("click", conectar);
$("nombre").addEventListener("keydown", (e) => { if (e.key === "Enter") conectar(); });

function mostrarJuego() {
  $("inicio").classList.add("oculto");
  for (const id of ["hud", "info", "ayuda"]) $(id).classList.toggle("oculto", id === "hud" && miRol !== "jugador");
}
function ocultarJuego() {
  for (const id of ["hud", "hudJefe", "info", "ayuda", "capa"]) $(id).classList.add("oculto");
  $("inicio").classList.remove("oculto");
  limpiarEntidades();
  vaciarBufer();
  actual = previo = null;
}
function limpiarEntidades() {
  for (const c of caballeros.values()) escena.remove(c.modelo.raiz);
  caballeros.clear();
  if (jefeVista) escena.remove(jefeVista.modelo.raiz);
  jefeVista = null;
}

// =====================================================================================
//  Snapshots y eventos
// =====================================================================================
// Búfer de interpolación: se dibuja un poco en el pasado (entre dos snapshots que ya llegaron),
// así los atrasos irregulares de la red no se ven como tirones. Los eventos (golpes, sonidos,
// números) se disparan cuando su snapshot "llega" a la pantalla, sincronizados con lo que se ve.
const bufer = [];                                   // { t, snap, listo }
let horaUltimo = null;
const retrasoMs = () => (miRol === "espectador" ? 170 : 90);
const periodoMs = () => (miRol === "espectador" ? 100 : TICK_MS);
function vaciarBufer() { bufer.length = 0; horaUltimo = null; }

function recibir(snap, llegada = performance.now()) {
  previo = actual; actual = snap; tActual = llegada;
  // Hora "ideal" del snapshot: un periodo exacto después del anterior, corregida poco a poco
  // hacia la hora real de llegada (si se desvía mucho, se re-sincroniza de golpe).
  const periodo = periodoMs();
  const esperada = horaUltimo === null ? llegada : horaUltimo + periodo;
  horaUltimo = Math.abs(llegada - esperada) > 3 * periodo ? llegada : esperada + (llegada - esperada) * 0.1;
  bufer.push({ t: horaUltimo, snap, listo: false });
  if (bufer.length > 40) bufer.splice(0, bufer.length - 40);
  if (snap.estado !== "mejora") elegida = false;
  actualizarHud(snap);                              // el HUD sí va al día (respuesta inmediata)
  actualizarCapa(snap);
}

function procesarVisual(snap, anterior) {
  // Caballeros que entran y salen
  const ids = Object.keys(snap.jugadores).sort();
  ids.forEach((id, i) => {
    if (!caballeros.has(id)) {
      const modelo = crearCaballero(COLORES_JUGADOR[i % COLORES_JUGADOR.length]);
      escena.add(modelo.raiz);
      const j = snap.jugadores[id];
      caballeros.set(id, { modelo, estado: "libre", tEstado: 0, giro: giroHacia(j.dx, j.dy), fase: 0, flash: 0,
                           golpe: 0, vel: 0, x: j.x, y: j.y });
    }
  });
  for (const [id, c] of caballeros) if (!snap.jugadores[id]) { escena.remove(c.modelo.raiz); caballeros.delete(id); }
  // Cambio de estado de cada caballero (para empezar animaciones)
  for (const [id, j] of Object.entries(snap.jugadores)) {
    const c = caballeros.get(id);
    if (j.estado !== c.estado) {
      if (j.estado === "esquivando") { sonido("esquiva"); particulas.emitir(mundo(j.x, j.y, 0.1), 10, 0x6a6058, 1.2, { gravedad: 2, vida: 0.6 }); }
      if (j.estado === "muerto") sonido("muerte");
      c.estado = j.estado; c.tEstado = performance.now();
    }
  }
  // El jefe: si cambia de piso, el anterior se desvanece y aparece el nuevo
  if (snap.jefe) {
    const clave = `${snap.piso}-${snap.jefe.id}`;
    if (!jefeVista || jefeVista.clave !== clave) {
      if (jefeVista) jefesMuriendo.push({ ...jefeVista, t: 0 });
      const modelo = crearJefe(snap.jefe.id);
      modelo.raiz.scale.setScalar(snap.jefe.radio);
      escena.add(modelo.raiz);
      jefeVista = { clave, modelo, estado: snap.jefe.estado, tEstado: performance.now(), giro: Math.PI, flash: 0,
                    retroceso: 0, vel: 0, aparicion: 0, x: snap.jefe.x, y: snap.jefe.y };
    }
    const jv = jefeVista;
    if (snap.jefe.estado !== jv.estado) {
      if (jv.estado === "preparando" && avisoAnterior) impactoVisual(avisoAnterior);
      jv.estado = snap.jefe.estado; jv.tEstado = performance.now();
    }
    // Embestida: si el jefe salta lejos de un snapshot al otro, deja polvo en el camino
    if (anterior && anterior.jefe && Math.hypot(snap.jefe.x - anterior.jefe.x, snap.jefe.y - anterior.jefe.y) > 1.5) {
      for (let k = 0; k <= 6; k++) {
        const x = lerp(anterior.jefe.x, snap.jefe.x, k / 6), y = lerp(anterior.jefe.y, snap.jefe.y, k / 6);
        particulas.emitir(mundo(x, y, 0.1), 6, 0x7a6a5a, 1.5, { gravedad: 1.5, vida: 0.9 });
      }
    }
  }
  // Aviso del jefe
  const aviso = snap.jefe && snap.jefe.aviso;
  if (aviso) {
    const clave = aviso.ataque + JSON.stringify(aviso.zonas);
    if (!avisoVisto || avisoVisto.clave !== clave) { avisoVisto = { clave, total: Math.max(aviso.en, 0.05), meteoros: false }; sonido("aviso"); }
    avisoAnterior = { ...aviso, tipo: aviso.ataque };
  } else avisoVisto = null;

  for (const e of snap.eventos) evento(e, snap);
  if (snap.eventos.some((e) => e.tipo === "fin") && actual) actualizarCapa(actual);
}

function impactoVisual(aviso) {
  for (const [zx, zy] of aviso.zonas) {
    const p = mundo(zx, zy);
    onda(p.x, p.z, aviso.radio);
    particulas.emitir(new THREE.Vector3(p.x, 0.1, p.z), 35, 0xff7a2a, 4, { radio: aviso.radio * 0.6, vida: 0.7 });
  }
  const yo = actual && actual.jugadores[miId];
  const cerca = yo && aviso.zonas.some(([zx, zy]) => Math.hypot(zx - yo.x, zy - yo.y) < aviso.radio + 3);
  sacudida = Math.max(sacudida, cerca ? 0.35 : 0.12);
  sonido("impacto");
}

function evento(e, snap) {
  let texto = null;
  if (e.tipo === "golpe" && jefeVista) {
    jefeVista.flash = 1; jefeVista.retroceso = 1;
    numero(`${Math.round(e.dano)}`, mundo(snap.jefe.x, snap.jefe.y, 2.4 * snap.jefe.radio), "#f1e3c0");
    particulas.emitir(mundo(snap.jefe.x, snap.jefe.y, 1.4), 14, 0xfff0c0, 3, { vida: 0.4 });
    if (e.jugador === miId) { sonido("golpe"); sacudida = Math.max(sacudida, 0.06); }
  } else if (e.tipo === "impacto") {
    const j = snap.jugadores[e.jugador], c = caballeros.get(e.jugador);
    if (j && e.dano > 0) {
      if (c) { c.flash = 1; c.golpe = 1; }
      numero(`-${Math.round(e.dano)}`, mundo(j.x, j.y, 2.0), "#ff5a4a");
      texto = `${e.ataque} alcanza a ${e.jugador}`;
    } else if (j) {
      numero("esquiva", mundo(j.x, j.y, 2.0), "#9fd0ff");
    }
  } else if (e.tipo === "piso") {
    banner(e.jefe, `Piso ${e.piso} de ${snap.pisos}`, 3200);
    sonido("piso");
  } else if (e.tipo === "jefe_vencido") {
    banner("Enemigo derrotado", "", 2600);
    sonido("victoria");
    if (jefeVista) particulas.emitir(mundo(snap.jefe.x, snap.jefe.y, 1), 120, 0xd8b46a, 5, { radio: 1, vida: 1.6, gravedad: 2 });
  } else if (e.tipo === "entra") texto = `${e.jugador} entra a la torre`;
  else if (e.tipo === "sale") texto = `${e.jugador} abandona la torre`;
  else if (e.tipo === "fin") fin = e;
  if (texto) aviso(texto);
}

function aviso(texto) {
  const d = document.createElement("div"); d.textContent = texto;
  $("eventos").prepend(d);
  while ($("eventos").children.length > 6) $("eventos").lastChild.remove();
}
let bannerTimer = 0;

// Números de daño que flotan sobre la escena
const numeros = [];
function numero(texto, pos, color) {
  const el = document.createElement("div");
  el.className = "numero"; el.textContent = texto; el.style.color = color;
  $("numeros").appendChild(el);
  // se reparten al azar y se apilan para que golpes seguidos no se encimen
  const recientes = numeros.filter((n) => n.t < 0.3 && n.pos.distanceTo(pos) < 1.5).length;
  const desvio = new THREE.Vector3((Math.random() - 0.5) * 1.6, recientes * 0.45 + Math.random() * 0.3, (Math.random() - 0.5) * 0.6);
  numeros.push({ el, pos: pos.clone().add(desvio), t: 0 });
}
function actualizarNumeros(dt) {
  const v = new THREE.Vector3();
  for (let k = numeros.length - 1; k >= 0; k--) {
    const n = numeros[k]; n.t += dt; n.pos.y += dt * 1.2;
    v.copy(n.pos).project(camara);
    n.el.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`;
    n.el.style.top = `${(-v.y * 0.5 + 0.5) * innerHeight}px`;
    n.el.style.opacity = String(1 - n.t / 1.1);
    if (n.t > 1.1 || v.z > 1) { n.el.remove(); numeros.splice(k, 1); }
  }
}

}

function mostrarCapa(html) { $("capa").innerHTML = html; $("capa").classList.remove("oculto"); }
function ocultarCapa() { $("capa").classList.add("oculto"); }
let finMostrado = false;
function actualizarCapa(s) {
  if (fin) {
    if (!finMostrado) {
      finMostrado = true;
      const gano = fin.resultado === "victoria";
      if (gano) banner("La torre ha caído", `Tiempo de combate: ${s.t.toFixed(1)} s`, 0);
      else banner("Has caído", esc(fin.motivo), 0, "#b3261e");
      sonido(gano ? "victoria" : "muerte");
      setTimeout(() => mostrarCapa(`<div style="margin-top:220px"><button id="otraRun">Subir de nuevo</button></div>`), 1800);
      setTimeout(() => { const b = $("otraRun"); if (b) b.onclick = () => { finMostrado = false; $("banner").classList.remove("visible"); ocultarCapa(); conectar(); }; }, 1850);
    }
    return;
  }
  finMostrado = false;
  if (s.estado === "esperando") {
    const listo = miRol === "jugador" ? "Pulsa <kbd>Enter</kbd> cuando estés listo" : "Esperando a los jugadores…";
    return mostrarCapa(`<h2 class="titulo">La torre aguarda</h2><p>${listo}<br><span style="color:var(--tenue)">La subida empieza sola en ${s.inicio_en.toFixed(0)} s</span></p>`);
  }
  if (s.estado === "mejora" && miRol === "jugador") {
    const ofertas = (s.ofertas || {})[miId] || [];
    if (elegida) return mostrarCapa(`<h2 class="titulo">Bendición aceptada</h2><p style="color:var(--tenue)">Esperando a los demás… ${s.elegir_en.toFixed(0)} s</p>`);
    const cartas = ofertas.map((o, i) => `<div class="carta" data-i="${i}"><b>${esc(o.nombre)}</b><small>${esc(o.descripcion)}</small><span class="tecla">tecla ${i + 1}</span></div>`).join("");
    mostrarCapa(`<h2 class="titulo">Elige una bendición</h2><div class="cartas">${cartas}</div><p style="color:var(--tenue)">${s.elegir_en.toFixed(0)} s</p>`);
    for (const el of document.querySelectorAll(".carta")) el.onclick = () => elegir(Number(el.dataset.i));
    return;
  }
  if (s.estado === "mejora") return mostrarCapa(`<h2 class="titulo">Los caballeros eligen su bendición…</h2>`);
  ocultarCapa();
}

// =====================================================================================
//  Controles: movimiento relativo a la cámara con el jefe fijado (estilo Souls)
// =====================================================================================
const teclas = new Set();
let ultimoMovimiento = { dx: 0, dy: 0, t: 0 };
function ejes() {
  const adelante = (teclas.has("w") || teclas.has("arrowup") ? 1 : 0) - (teclas.has("s") || teclas.has("arrowdown") ? 1 : 0);
  const derecha = (teclas.has("d") || teclas.has("arrowright") ? 1 : 0) - (teclas.has("a") || teclas.has("arrowleft") ? 1 : 0);
  return [adelante, derecha];
}
function haciaElJefe() {                     // vector (servidor) del caballero al jefe
  const yo = actual && actual.jugadores[miId];
  if (!yo || !actual.jefe || actual.jefe.estado === "muerto") return [0, 1];
  const dx = actual.jefe.x - yo.x, dy = actual.jefe.y - yo.y, d = Math.hypot(dx, dy) || 1;
  return [dx / d, dy / d];
}
function direccionDeseada() {
  const [adelante, derecha] = ejes();
  const [fx, fy] = haciaElJefe(), rx = fy, ry = -fx;       // derecha = adelante girado 90°
  return [fx * adelante + rx * derecha, fy * adelante + ry * derecha];
}
function actualizarMovimiento(ahora) {
  if (miRol !== "jugador" || !actual) return;
  const [dx, dy] = direccionDeseada();
  const parado = Math.abs(dx) + Math.abs(dy) < 1e-6;
  const u = ultimoMovimiento, angulo = Math.abs(Math.atan2(dy, dx) - Math.atan2(u.dy, u.dx));
  const cambio = parado !== (Math.abs(u.dx) + Math.abs(u.dy) < 1e-6) || (!parado && (angulo > 0.05 || ahora - u.t > 200));
  if (cambio) { enviar({ accion: "mover", dx, dy }); ultimoMovimiento = { dx, dy, t: ahora }; }
}
function atacar() {
  const yo = actual && actual.jugadores[miId];
  if (!yo || !actual.jefe) return;
  enviar({ accion: "atacar", dx: actual.jefe.x - yo.x, dy: actual.jefe.y - yo.y });
}
function esquivar() {
  const [dx, dy] = direccionDeseada();
  if (Math.abs(dx) + Math.abs(dy) < 1e-6) { const [fx, fy] = haciaElJefe(); enviar({ accion: "esquivar", dx: -fx, dy: -fy }); }
  else enviar({ accion: "esquivar", dx, dy });
}
function elegir(i) {
  const ofertas = actual && (actual.ofertas || {})[miId];
  if (!ofertas || !ofertas[i] || elegida) return;
  enviar({ accion: "elegir_mejora", id: ofertas[i].id });
  elegida = true; sonido("mejora");
  actualizarCapa(actual);
}
addEventListener("keydown", (e) => {
  if (["INPUT", "SELECT"].includes(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "p") { modoPixelado = !modoPixelado; lienzo.classList.toggle("pixelado", modoPixelado); ajustarTamano(); return; }
  if (k === "m") { silencio = !silencio; return; }
  if (miRol !== "jugador") return;
  if (k === "enter" || k === " ") e.preventDefault();
  if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) { teclas.add(k); e.preventDefault(); }
  else if (k === "j" && !e.repeat) atacar();
  else if ((k === " " || k === "k" || k === "shift") && !e.repeat) esquivar();
  else if (k === "enter") enviar({ accion: "listo" });
  else if (["1", "2", "3"].includes(k)) elegir(Number(k) - 1);
});
addEventListener("keyup", (e) => teclas.delete(e.key.toLowerCase()));
addEventListener("blur", () => teclas.clear());
lienzo.addEventListener("mousedown", (e) => { if (miRol === "jugador" && e.button === 0) atacar(); if (e.button === 2) esquivar(); });
lienzo.addEventListener("contextmenu", (e) => e.preventDefault());

// =====================================================================================
//  Sonido sintetizado con WebAudio (sin archivos de audio)
// =====================================================================================
let audio = null, silencio = false, bufferRuido = null;
function iniciarAudio() {
  if (audio) return;
  try {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    bufferRuido = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const d = bufferRuido.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { audio = null; }
}
function tono(frec, frecFin, dur, tipo = "sine", vol = 0.2, retraso = 0) {
  const t = audio.currentTime + retraso, o = audio.createOscillator(), g = audio.createGain();
  o.type = tipo; o.frequency.setValueAtTime(frec, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, frecFin), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
}
function soplo(dur, frec, vol = 0.25, q = 1) {
  const t = audio.currentTime, s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  s.buffer = bufferRuido; f.type = "bandpass"; f.frequency.setValueAtTime(frec, t); f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(audio.destination); s.start(t); s.stop(t + dur);
}
function sonido(tipo) {
  if (!audio || silencio) return;
  if (tipo === "golpe") { soplo(0.09, 2200, 0.35, 2); tono(180, 90, 0.1, "square", 0.08); }
  else if (tipo === "impacto") { tono(90, 35, 0.45, "sine", 0.5); soplo(0.3, 300, 0.35); }
  else if (tipo === "esquiva") soplo(0.18, 900, 0.18, 0.7);
  else if (tipo === "aviso") tono(220, 180, 0.15, "triangle", 0.05);
  else if (tipo === "mejora") { tono(523, 523, 0.25, "sine", 0.12); tono(784, 784, 0.4, "sine", 0.1, 0.12); }
  else if (tipo === "piso") { tono(110, 105, 1.2, "sawtooth", 0.06); tono(165, 160, 1.2, "sine", 0.08); }
  else if (tipo === "victoria") { tono(392, 392, 0.3, "triangle", 0.12); tono(523, 523, 0.3, "triangle", 0.12, 0.15); tono(659, 659, 0.6, "triangle", 0.12, 0.3); }
  else if (tipo === "muerte") tono(260, 55, 1.4, "sawtooth", 0.1);
}

// =====================================================================================
//  Animación de cada cuadro
// =====================================================================================
// --- Herramientas de animación ---------------------------------------------------------------
// Primer orden (para suavizar medidas como la velocidad): se acerca exponencialmente.
const amortiguar = (valor, objetivo, k, dt) => valor + (objetivo - valor) * (1 - Math.exp(-k * dt));
// Resorte de segundo orden: arranca suave, acelera y se asienta (con un leve rebote si z < 1).
// Da sensación de peso y de más cuadros intermedios SIN cambiar cuánto dura cada gesto.
function resorte(r, clave, objetivo, dt, w = 18, z = 0.8) {
  let s = r[clave];
  if (!s) s = r[clave] = { x: objetivo, v: 0 };
  const pasos = Math.max(1, Math.ceil(dt / (1 / 240)));        // sub-pasos: estable a cualquier fps
  const h = dt / pasos;
  for (let i = 0; i < pasos; i++) {
    s.v += (w * w * (objetivo - s.x) - 2 * z * w * s.v) * h;
    s.x += s.v * h;
  }
  return s.x;
}
// Fotogramas clave [[t, valor], ...] con transición suave (entrada y salida) entre cada par.
function claves(t, kf) {
  if (t <= kf[0][0]) return kf[0][1];
  for (let i = 1; i < kf.length; i++) {
    if (t <= kf[i][0]) { const [ta, va] = kf[i - 1], [tb, vb] = kf[i]; return lerp(va, vb, suave((t - ta) / (tb - ta))); }
  }
  return kf[kf.length - 1][1];
}
const angulo = (a) => ((a % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI;   // a [-π, π]
const v1 = new THREE.Vector3(), v2 = new THREE.Vector3();

function animarCaballero(c, ja, jb, alfa, ahora, dt) {
  const m = c.modelo, r = c.r || (c.r = {});
  const x = lerp(ja.x, jb.x, alfa), y = lerp(ja.y, jb.y, alfa);
  const velocidad = Math.hypot(x - c.x, y - c.y) / Math.max(dt, 1e-3);
  c.x = x; c.y = y;
  const velPrevia = c.vel;
  c.vel = amortiguar(c.vel, ja.estado === "esquivando" ? 0 : Math.min(velocidad, 8), 8, dt);
  const acel = (c.vel - velPrevia) / Math.max(dt, 1e-3);
  m.raiz.position.copy(mundo(x, y));
  const dx = lerp(ja.dx, jb.dx, alfa), dy = lerp(ja.dy, jb.dy, alfa);
  const giroAntes = c.giro;
  if (Math.abs(dx) + Math.abs(dy) > 1e-3) c.giro = lerpAngulo(c.giro, giroHacia(dx, dy), 1 - Math.exp(-dt * 12));
  const velGiro = angulo(c.giro - giroAntes) / Math.max(dt, 1e-3);
  m.raiz.rotation.y = c.giro;

  const t = (ahora - c.tEstado) / 1000, s = ahora / 1000;
  const A = limitar(c.vel / 5, 0, 1);                     // 0 = quieto, 1 = caminando a velocidad normal
  const fasePrevia = c.fase;
  c.fase += dt * (2 + 9 * A);                             // la zancada sigue a la velocidad real
  if (A > 0.4 && Math.floor(fasePrevia / Math.PI) !== Math.floor(c.fase / Math.PI)) {
    particulas.emitir(mundo(x, y, 0.05), 3, 0x5a5048, 0.7, { gravedad: 1, vida: 0.55, radio: 0.2 });   // pisada
  }
  if (c.estAnim === "esquivando" && ja.estado !== "esquivando") {                                       // aterrizaje
    particulas.emitir(mundo(x, y, 0.05), 12, 0x6a6058, 1.4, { gravedad: 2, vida: 0.6, radio: 0.4 });
  }
  c.estAnim = ja.estado;
  c.golpe = Math.max(0, c.golpe - dt * 3);
  const g = c.golpe;
  let mirar = 0;                                          // la cabeza busca al jefe
  if (jefeVista) mirar = limitar(angulo(giroHacia(jefeVista.x - x, jefeVista.y - y) - c.giro), -0.8, 0.8);

  // ---- Pose base: en guardia (quieto) o caminando --------------------------------------
  const sf = Math.sin(c.fase), cf = Math.cos(c.fase), resp = Math.sin(s * 1.6), q = 1 - A;
  const p = {
    alto: 0.6 - 0.03 * q + A * (0.035 * Math.cos(2 * c.fase) - 0.02) + 0.006 * resp,
    giroX: 0, giroZ: 0.02 * Math.sin(s * 0.8) * q + 0.045 * A * sf,          // cambio de peso / balanceo
    pechoX: 0.04 + 0.16 * A + limitar(acel * 0.02, -0.12, 0.12) + 0.02 * resp,  // se inclina al arrancar
    pechoY: 0.2 * A * sf - 0.15 * q, pechoZ: -0.04 * A * sf,
    cuelloX: -0.04 * A - 0.015 * resp, cuelloY: mirar * 0.6 - 0.2 * A * sf + 0.15 * q,
    musloI: -0.62 * A * sf - 0.15 * q, rodillaI: A * (0.1 + 0.8 * Math.max(0, cf)) + 0.15 * q,
    musloD: 0.62 * A * sf + 0.12 * q, rodillaD: A * (0.1 + 0.8 * Math.max(0, -cf)) + 0.15 * q,
    hombroD: -0.45 - 0.3 * A * sf + 0.03 * resp, codoD: -0.7 - 0.1 * A,
    hombroI: 0.45 * A * sf - 0.45 * q, codoI: -0.9 * q - 0.4 * A,
  };
  let kBrazo = [22, 0.75], kCuerpo = [16, 0.75], kAlto = [20, 0.7];

  if (ja.estado === "atacando") {
    // 0–0.10 anticipación (se agacha y gira) · 0.10–0.27 carga sobre la cabeza ·
    // 0.27–0.33 tajo con estocada · 0.33–0.45 seguimiento · 0.45–0.55 vuelve a la guardia
    p.hombroD = claves(t, [[0, -0.5], [0.1, -0.9], [0.27, -3.5], [0.33, -0.7], [0.42, -0.25], [0.55, -0.5]]);
    p.codoD = claves(t, [[0, -0.6], [0.1, -1.0], [0.27, -1.3], [0.31, -0.1], [0.42, -0.2], [0.55, -0.6]]);
    p.hombroI = claves(t, [[0, -0.3], [0.27, -0.6], [0.33, 0.25], [0.55, -0.35]]);
    p.codoI = claves(t, [[0, -0.9], [0.27, -1.2], [0.33, -0.5], [0.55, -0.9]]);
    p.pechoY = claves(t, [[0, 0], [0.1, -0.25], [0.27, -0.55], [0.33, 0.4], [0.42, 0.45], [0.55, 0]]);
    p.pechoX = claves(t, [[0, 0.05], [0.1, -0.02], [0.27, -0.15], [0.32, 0.32], [0.42, 0.26], [0.55, 0.06]]);
    p.alto = claves(t, [[0, 0.6], [0.1, 0.54], [0.27, 0.6], [0.32, 0.5], [0.45, 0.52], [0.55, 0.58]]);
    p.musloI = claves(t, [[0, -0.15], [0.1, -0.05], [0.27, -0.1], [0.32, -0.7], [0.45, -0.55], [0.55, -0.2]]);
    p.rodillaI = claves(t, [[0, 0.15], [0.1, 0.35], [0.27, 0.2], [0.32, 0.7], [0.45, 0.6], [0.55, 0.2]]);
    p.musloD = claves(t, [[0, 0.12], [0.1, 0.2], [0.27, 0.15], [0.32, 0.5], [0.45, 0.45], [0.55, 0.15]]);
    p.rodillaD = claves(t, [[0, 0.15], [0.1, 0.4], [0.32, 0.25], [0.55, 0.2]]);
    kBrazo = [34, 0.72]; kCuerpo = [26, 0.75]; kAlto = [28, 0.75];
  } else if (ja.estado === "esquivando") {
    // agacharse · rodar · aterrizar (0.4 s en total, como en el servidor)
    p.alto = claves(t, [[0, 0.6], [0.05, 0.45], [0.2, 0.35], [0.33, 0.42], [0.4, 0.52]]);
    p.musloI = p.musloD = claves(t, [[0, -0.1], [0.05, -1.0], [0.3, -1.2], [0.4, -0.4]]);
    p.rodillaI = p.rodillaD = claves(t, [[0, 0.2], [0.05, 1.3], [0.3, 1.5], [0.4, 0.7]]);
    p.hombroD = p.hombroI = -1.0; p.codoD = p.codoI = -1.6; p.pechoX = 0.45; p.pechoY = 0;
    kAlto = [30, 0.75]; kCuerpo = [26, 0.8];
  } else if (ja.estado === "muerto") {
    // se le doblan las rodillas y luego cae de espaldas
    p.alto = claves(t, [[0, 0.6], [0.3, 0.4], [0.9, 0.18]]);
    p.giroX = claves(t, [[0, 0], [0.3, 0.25], [0.9, -1.45]]);
    p.rodillaI = p.rodillaD = claves(t, [[0, 0.1], [0.3, 1.4], [0.9, 0.3]]);
    p.musloI = p.musloD = claves(t, [[0, 0], [0.3, -0.9], [0.9, -0.1]]);
    p.hombroD = p.hombroI = claves(t, [[0, -0.4], [0.3, -0.2], [0.9, -2.6]]);
    p.codoD = p.codoI = -0.2; p.cuelloX = claves(t, [[0, 0], [0.9, 0.4]]); p.pechoX = claves(t, [[0, 0.1], [0.3, 0.35], [0.9, 0]]);
    kCuerpo = [12, 0.55];
  }
  // Golpe recibido: tambaleo (los resortes poco amortiguados lo hacen rebotar)
  p.pechoX -= 0.55 * g; p.cuelloX -= 0.5 * g; p.hombroD += 0.5 * g; p.hombroI += 0.5 * g;
  p.alto -= 0.08 * g; p.rodillaI += 0.4 * g; p.rodillaD += 0.4 * g;

  // ---- Aplicar con resortes ------------------------------------------------------------
  if (ja.estado === "esquivando") {                     // la vuelta es exacta (dura lo que dice el servidor)
    m.giro.rotation.x = claves(t, [[0, 0], [0.05, 0.25], [0.33, Math.PI * 2 - 0.15], [0.4, Math.PI * 2]]);
    r.giroX = { x: m.giro.rotation.x, v: 0 };
  } else {
    if (r.giroX && r.giroX.x > Math.PI) r.giroX.x -= Math.PI * 2;      // termina la vuelta sin desandarla
    m.giro.rotation.x = resorte(r, "giroX", p.giroX, dt, kCuerpo[0], kCuerpo[1]);
  }
  m.giro.position.y = resorte(r, "alto", p.alto, dt, kAlto[0], kAlto[1]);
  m.giro.rotation.z = resorte(r, "giroZ", p.giroZ, dt, 10, 0.8);
  m.pecho.rotation.x = resorte(r, "pechoX", p.pechoX, dt, kCuerpo[0], g > 0.05 ? 0.4 : kCuerpo[1]);
  m.pecho.rotation.y = resorte(r, "pechoY", p.pechoY, dt, kCuerpo[0], kCuerpo[1]);
  m.pecho.rotation.z = resorte(r, "pechoZ", p.pechoZ, dt, 14, 0.8);
  m.cuello.rotation.x = resorte(r, "cuelloX", p.cuelloX, dt, 12, g > 0.05 ? 0.4 : 0.8);
  m.cuello.rotation.y = resorte(r, "cuelloY", p.cuelloY, dt, 10, 0.85);
  const [pI, pD] = m.piernas;
  pI.muslo.rotation.x = resorte(r, "musloI", p.musloI, dt, 24, 0.8);
  pI.rodilla.rotation.x = resorte(r, "rodillaI", p.rodillaI, dt, 24, 0.8);
  pD.muslo.rotation.x = resorte(r, "musloD", p.musloD, dt, 24, 0.8);
  pD.rodilla.rotation.x = resorte(r, "rodillaD", p.rodillaD, dt, 24, 0.8);
  m.brazoD.hombro.rotation.x = resorte(r, "hombroD", p.hombroD, dt, kBrazo[0], kBrazo[1]);
  m.brazoD.codo.rotation.x = resorte(r, "codoD", p.codoD, dt, kBrazo[0], kBrazo[1]);
  m.brazoI.hombro.rotation.x = resorte(r, "hombroI", p.hombroI, dt, 20, 0.75);
  m.brazoI.codo.rotation.x = resorte(r, "codoI", p.codoI, dt, 20, 0.75);

  // Capa: tres segmentos en cadena, cada uno reacciona al movimiento del anterior
  const c0 = resorte(r, "capa0", 0.15 + 0.55 * A + 0.06 * Math.sin(s * 2.1) - 0.3 * p.pechoX, dt, 7, 0.45);
  const c1 = resorte(r, "capa1", 0.06 + 0.25 * A - 0.035 * r.capa0.v, dt, 6, 0.4);
  const c2 = resorte(r, "capa2", 0.04 + 0.2 * A - 0.035 * r.capa1.v + 0.04 * Math.sin(s * 3.3), dt, 5, 0.4);
  m.capa[0].rotation.x = c0; m.capa[1].rotation.x = c1; m.capa[2].rotation.x = c2;
  m.capa[0].rotation.z = resorte(r, "capaZ", limitar(-velGiro * 0.06, -0.5, 0.5), dt, 6, 0.5);

  actualizarEstela(m, ja.estado === "atacando" && t > 0.2 && t < 0.42);
  c.flash = Math.max(0, c.flash - dt * 5);              // destello rojo al recibir daño
  for (const mt of m.mats) mt.emissive.setRGB(c.flash * 0.7, 0, 0);
}

// La estela sigue la punta de la espada durante el tajo y luego se desvanece
function actualizarEstela(m, activa) {
  const e = m.estela, pts = e.puntos;
  if (activa) {
    m.raiz.updateMatrixWorld(true);
    pts.unshift({ punta: m.raiz.worldToLocal(m.punta.getWorldPosition(v1)).clone(),
                  base: m.raiz.worldToLocal(m.base.getWorldPosition(v2)).clone() });
    if (pts.length > e.N) pts.length = e.N;
  } else if (pts.length) pts.splice(-2, 2);               // se acorta desde la cola: se desvanece
  const pos = e.malla.geometry.attributes.position, col = e.malla.geometry.attributes.color;
  for (let i = 0; i < e.N; i++) {
    const q = pts[Math.min(i, pts.length - 1)];
    const f = pts.length && i < pts.length ? (1 - i / e.N) * 0.85 : 0;
    for (const [k, punto] of [[i * 2, q ? q.punta : v1.set(0, -9, 0)], [i * 2 + 1, q ? q.base : v1.set(0, -9, 0)]]) {
      pos.setXYZ(k, punto.x, punto.y, punto.z);
      col.setXYZ(k, f, f * 0.9, f * 0.65);
    }
  }
  pos.needsUpdate = true; col.needsUpdate = true;
}

function animarJefe(jv, ja, jb, alfa, aviso, ahora, dt) {
  const m = jv.modelo, r = jv.r || (jv.r = {}), radio = ja.radio;
  const x = lerp(ja.x, jb.x, alfa), y = lerp(ja.y, jb.y, alfa);
  const velocidad = Math.hypot(x - jv.x, y - jv.y) / Math.max(dt, 1e-3);
  jv.x = x; jv.y = y;
  jv.vel = amortiguar(jv.vel, velocidad > 15 ? jv.vel : velocidad, 6, dt);   // ignora el salto de la embestida
  jv.aparicion = Math.min(1, jv.aparicion + dt / 1.2);
  m.raiz.position.copy(mundo(x, y, (salida(jv.aparicion) - 1) * 2.5 * radio));   // surge del suelo
  // mira hacia donde va a golpear, o hacia el caballero más cercano
  let objetivo = null, cercano = null;
  let mejor = Infinity;
  for (const c of caballeros.values()) {
    const d = Math.hypot(c.x - x, c.y - y);
    if (c.estado !== "muerto" && d < mejor) { mejor = d; cercano = [c.x - x, c.y - y]; }
  }
  if (aviso && aviso.zonas.length) {
    const [zx, zy] = aviso.zonas[0];
    if (Math.hypot(zx - ja.x, zy - ja.y) > 0.3) objetivo = [zx - ja.x, zy - ja.y];
  }
  objetivo = objetivo || cercano;
  if (objetivo && ja.estado !== "recuperando") jv.giro = lerpAngulo(jv.giro, giroHacia(objetivo[0], objetivo[1]), 1 - Math.exp(-dt * 4));
  m.raiz.rotation.y = jv.giro;

  const t = (ahora - jv.tEstado) / 1000, s = ahora / 1000;
  const A = limitar(jv.vel / 2.5, 0, 1);
  jv.fase = (jv.fase || 0) + dt * (1.5 + 5 * A);
  jv.retroceso = Math.max(0, jv.retroceso - dt * 2.5);
  const mirar = cercano ? limitar(angulo(giroHacia(cercano[0], cercano[1]) - jv.giro), -0.7, 0.7) : 0;
  const p = {
    arma: m.reposo + 0.06 * Math.sin(s * 1.4), giroX: 0.05 * A, giroZ: 0.05 * A * Math.sin(jv.fase),
    alto: (m.tipo === "bruja" ? 0.25 + 0.1 * Math.sin(s * 2.5) : Math.abs(Math.sin(jv.fase)) * 0.06 * A) + 0.01 * Math.sin(s * 1.2),
    cabezaY: mirar, cabezaX: 0, piernas: 0,
  };
  let kArma = [10, 0.85], brilloOjos = 1, rojo = 0;
  if (ja.estado === "preparando" && aviso && avisoVisto) {
    // anticipación: el arma baja un poco antes de subir, el cuerpo se agacha y se echa atrás
    const q = 1 - limitar(aviso.en / avisoVisto.total, 0, 1);
    p.arma = claves(q, [[0, m.reposo], [0.18, m.reposo + (m.reposo - m.alzado) * 0.1], [0.8, m.alzado], [1, m.alzado + (m.alzado - m.reposo) * 0.04]]);
    p.giroX = claves(q, [[0, 0], [0.18, 0.06], [1, m.tipo === "sabueso" ? 0.28 : -0.2]]);
    p.alto -= 0.12 * q; p.cabezaX = -0.12 * q; p.piernas = 0.15 * q;
    brilloOjos = 1 + 3 * q; rojo = q; kArma = [14, 0.8];
    if (aviso.ataque.includes("lluvia") && aviso.en < 0.5 && !avisoVisto.meteoros) {   // meteoros de ceniza
      avisoVisto.meteoros = true;
      for (const [zx, zy] of aviso.zonas) particulas.emitir(mundo(zx, zy, 7), 30, 0xff8a2a, 0.6, { radio: 0.6, gravedad: 30, subir: -1, vida: 0.7 });
    }
  } else if (ja.estado === "recuperando") {
    // golpe seco con rebote, luego una recuperación lenta y pesada
    p.arma = t < 0.12 ? m.golpe : lerp(m.golpe, m.reposo, suave(limitar((t - 0.25) / 0.7, 0, 1)));
    p.giroX = claves(t, [[0, 0.22], [0.3, 0.18], [1, 0]]);
    p.alto += claves(t, [[0, -0.1], [1, 0]]); p.cabezaX = claves(t, [[0, 0.15], [1, 0]]);
    kArma = t < 0.12 ? [40, 0.45] : [6, 0.9];
  }
  p.giroX -= 0.14 * jv.retroceso;                        // golpe recibido

  m.arma.rotation.x = resorte(r, "arma", p.arma, dt, kArma[0], kArma[1]);
  m.giro.rotation.x = resorte(r, "giroX", p.giroX, dt, 10, jv.retroceso > 0.05 ? 0.4 : 0.65);
  m.giro.rotation.z = resorte(r, "giroZ", p.giroZ, dt, 6, 0.7);
  m.giro.position.y = resorte(r, "alto", p.alto, dt, 10, 0.7);
  m.giro.scale.set(1 + 0.03 * jv.retroceso, (1 + Math.sin(s * 2.2) * 0.02) * (1 - 0.05 * jv.retroceso), 1 + 0.03 * jv.retroceso);
  if (m.cabeza) {
    m.cabeza.rotation.y = resorte(r, "cabezaY", p.cabezaY, dt, 6, 0.85);
    m.cabeza.rotation.x = resorte(r, "cabezaX", p.cabezaX, dt, 8, 0.8);
  }
  // Piernas: pasos alternos (el Sabueso mueve las patas en pares diagonales)
  const paso = Math.sin(jv.fase) * (m.cuadrupedo ? 0.6 : 0.5) * A;
  m.piernas.forEach((pierna, i) => {
    const signo = m.cuadrupedo ? (i < 2 ? 1 : -1) : (i === 0 ? 1 : -1);
    pierna.rotation.x = resorte(r, "pierna" + i, signo * paso, dt, 16, 0.8);
    pierna.rotation.z = resorte(r, "piernaZ" + i, (i % 2 ? -1 : 1) * p.piernas, dt, 10, 0.8);   // abre las piernas al cargar
  });
  // Partes que se mecen solas: túnica, capa, cola y halo
  if (m.capa) {
    if (m.tipo === "bruja") { m.capa.rotation.z = 0.05 * Math.sin(s * 1.3); m.capa.rotation.x = resorte(r, "tunica", 0.08 * A, dt, 5, 0.5); }
    else if (m.tipo === "rey") m.capa.rotation.x = resorte(r, "capa", 0.1 + 0.4 * A + 0.05 * Math.sin(s * 1.7) + 0.2 * jv.retroceso, dt, 6, 0.45);
    else if (m.tipo === "sabueso") m.capa.rotation.z = 0.4 * Math.sin(s * (3 + 4 * A));
    else m.capa.rotation.z += dt * 0.3;
  }
  jv.flash = Math.max(0, jv.flash - dt * 8);
  for (const mt of m.mats) {
    if (jv.flash > 0) mt.emissive.setRGB(jv.flash * 0.8, jv.flash * 0.8, jv.flash * 0.75);
    else mt.emissive.setRGB(0.35 * rojo, 0.05 * rojo, 0);
  }
  for (const o of m.ojos) { if (!o.userData.base) o.userData.base = o.color.clone(); o.color.copy(o.userData.base).multiplyScalar(brilloOjos); }
}

function animarMuertes(dt) {
  for (let k = jefesMuriendo.length - 1; k >= 0; k--) {
    const j = jefesMuriendo[k]; j.t += dt;
    const p = limitar(j.t / 2.2, 0, 1), m = j.modelo;
    m.giro.rotation.x = suave(p) * 0.5;
    m.raiz.position.y = -suave(p) * 3;
    if (Math.random() < 0.6) particulas.emitir(m.raiz.position.clone().add(new THREE.Vector3(0, 1.2, 0)), 3, 0xd8b46a, 1.5, { radio: 1, gravedad: -1, vida: 1.2 });
    if (p >= 1) { escena.remove(m.raiz); jefesMuriendo.splice(k, 1); }
  }
}

// Avisos del jefe dibujados en el suelo: un anillo y un disco que se llena
const marcas = [];
function marca(i) {
  while (marcas.length <= i) {
    const g = new THREE.Group();
    const anillo = new THREE.Mesh(new THREE.RingGeometry(0.94, 1, 48), new THREE.MeshBasicMaterial({ color: 0xff3b30, transparent: true, opacity: 0.9, depthWrite: false }));
    const disco = new THREE.Mesh(new THREE.CircleGeometry(1, 48), new THREE.MeshBasicMaterial({ color: 0xff3b30, transparent: true, opacity: 0.3, depthWrite: false }));
    const fondo = new THREE.Mesh(new THREE.CircleGeometry(1, 48), new THREE.MeshBasicMaterial({ color: 0xff3b30, transparent: true, opacity: 0.12, depthWrite: false }));
    for (const x of [anillo, disco, fondo]) { x.rotation.x = -Math.PI / 2; g.add(x); }
    anillo.position.y = 0.04; disco.position.y = 0.035; fondo.position.y = 0.03;
    g.userData = { anillo, disco, fondo };
    escena.add(g); marcas.push(g);
  }
  return marcas[i];
}
function dibujarAvisos(ahora, a) {
  const zonas = a && avisoVisto ? a.zonas : [];
  zonas.forEach(([zx, zy], i) => {
    const g = marca(i), p = 1 - limitar(a.en / avisoVisto.total, 0, 1);
    g.visible = true; g.position.copy(mundo(zx, zy));
    g.scale.setScalar(a.radio);
    g.userData.disco.scale.setScalar(Math.max(0.01, p));
    g.userData.anillo.material.opacity = 0.6 + 0.4 * Math.abs(Math.sin(ahora / (p > 0.7 ? 50 : 120)));
  });
  for (let i = zonas.length; i < marcas.length; i++) marcas[i].visible = false;
}

// Cámara: detrás del caballero mirando al jefe; los espectadores giran alrededor de la arena
const objetivoCamara = new THREE.Vector3(), miradaCamara = new THREE.Vector3(0, 1, 0);
function actualizarCamara(dt, ahora) {
  const yo = actual && caballeros.get(miId), jefe = jefeVista && actual && actual.jefe;
  let destino, mirar;
  if (miRol === "jugador" && yo) {
    const pk = mundo(yo.x, yo.y);
    const pj = jefe ? mundo(jefeVista.x, jefeVista.y) : new THREE.Vector3(0, 0, -10);
    const atras = new THREE.Vector3().subVectors(pk, pj).setY(0);
    if (atras.lengthSq() < 0.01) atras.set(0, 0, 1);
    atras.normalize();
    // La cámara no sale de la arena (afuera hay muros y columnas que la taparían):
    // si no cabe detrás del caballero, se acerca y sube para seguir viendo la escena.
    const LIMITE = 9.6;
    let distancia = 5.2;
    for (const [p, d] of [[pk.x, atras.x], [pk.z, atras.z]]) {
      if (d > 1e-6) distancia = Math.min(distancia, (LIMITE - p) / d);
      if (d < -1e-6) distancia = Math.min(distancia, (-LIMITE - p) / d);
    }
    distancia = Math.max(1.2, distancia);
    destino = pk.clone().addScaledVector(atras, distancia).add(new THREE.Vector3(0, 3.1 + (5.2 - distancia) * 0.9, 0));
    mirar = pk.clone().lerp(pj, 0.35).add(new THREE.Vector3(0, 1.1, 0));
  } else {                                     // pantalla de inicio y espectadores
    const a = ahora / 9000;
    destino = new THREE.Vector3(Math.sin(a) * 15, 8.5, Math.cos(a) * 15);
    mirar = new THREE.Vector3(0, 0.8, 0);
  }
  const k = 1 - Math.exp(-dt * 5);
  camara.position.lerp(destino, k);
  miradaCamara.lerp(mirar, k);
  sacudida = Math.max(0, sacudida - dt * 1.6);
  const s = sacudida * sacudida;
  objetivoCamara.copy(miradaCamara).add(new THREE.Vector3((Math.random() - 0.5) * s, (Math.random() - 0.5) * s, 0));
  camara.lookAt(objetivoCamara);
}

let ultimo = performance.now();
function cuadro(ahora) {
  actualizarCuadro(ahora);
  requestAnimationFrame(cuadro);
}
function actualizarCuadro(ahora) {
  const dt = Math.min(0.05, (ahora - ultimo) / 1000); ultimo = ahora;
  actualizarMovimiento(ahora);
  let avisoDibujado = null;
  if (bufer.length) {
    const hora = ahora - retrasoMs();                 // se dibuja un poco en el pasado
    // 1. Los snapshots que ya "llegaron" a la pantalla disparan sus eventos, en orden
    for (let i = 0; i < bufer.length; i++) {
      const s = bufer[i];
      if (!s.listo && (s.t <= hora || i === 0)) { s.listo = true; procesarVisual(s.snap, i > 0 ? bufer[i - 1].snap : null); }
    }
    // 2. El par (a, b) que rodea la hora de dibujo; si la red se atrasa, se queda en el último
    let i = 0;
    while (i < bufer.length - 1 && bufer[i + 1].t <= hora) i++;
    const a = bufer[i], b = bufer[Math.min(i + 1, bufer.length - 1)];
    const alfa = b === a ? 1 : limitar((hora - a.t) / Math.max(1, b.t - a.t), 0, 1);
    const sa = a.snap, sb = b.snap;
    for (const [id, j] of Object.entries(sa.jugadores)) {
      const c = caballeros.get(id);
      if (c) animarCaballero(c, j, sb.jugadores[id] || j, alfa, ahora, dt);
    }
    if (jefeVista && sa.jefe && jefeVista.clave === `${sa.piso}-${sa.jefe.id}`) {
      const mismoJefe = sb.jefe && sb.piso === sa.piso && sb.jefe.id === sa.jefe.id;
      // el tiempo que falta para el impacto también se interpola: el disco se llena sin escalones
      if (sa.jefe.aviso) {
        const avb = mismoJefe && sb.jefe.aviso && JSON.stringify(sb.jefe.aviso.zonas) === JSON.stringify(sa.jefe.aviso.zonas) ? sb.jefe.aviso : null;
        avisoDibujado = { ...sa.jefe.aviso, en: avb ? lerp(sa.jefe.aviso.en, avb.en, alfa) : Math.max(0, sa.jefe.aviso.en - alfa * periodoMs() / 1000) };
      }
      animarJefe(jefeVista, sa.jefe, mismoJefe ? sb.jefe : sa.jefe, alfa, avisoDibujado, ahora, dt);
    }
    if (bufer.length > 3 && bufer[1].t < hora - 1000) bufer.splice(0, 1);       // limpia lo viejo
  }
  animarMuertes(dt);
  dibujarAvisos(ahora, avisoDibujado);
  for (const l of llamas) {                    // fuego vivo
    const f = 0.8 + Math.sin(ahora / 90 + l.fase) * 0.12 + Math.random() * 0.12;
    l.luz.intensity = 22 * f;
    l.fuego.scale.set(1, f, 1);
    if (Math.random() < 0.25) particulas.emitir(l.fuego.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 0.4, 0)), 1, 0xff9a40, 0.6, { gravedad: -0.6, vida: 1.6, subir: 1 });
  }
  if (Math.random() < 0.3) {                   // ceniza que flota en el aire
    particulas.emitir(new THREE.Vector3((Math.random() - 0.5) * 22, 0.2, (Math.random() - 0.5) * 22), 1, 0x6a5a50, 0.4, { gravedad: -0.15, vida: 4, subir: 0.5 });
  }
  particulas.actualizar(dt);
  actualizarOndas(dt);
  actualizarCamara(dt, ahora);
  actualizarNumeros(dt);
  renderer.render(escena, camara);
}
requestAnimationFrame(cuadro);

// Para depurar desde la consola del navegador
window.laTorre = {
  get estado() { return actual; }, get conexion() { return ws; }, enviar, atacar, esquivar, camara, escena, THREE,
  crearJefe, crearCaballero, renderer,
  // avanza n cuadros a mano (sirve para probar con la pestaña oculta, donde el navegador pausa el dibujo)
  avanzar(n = 1) { for (let i = 0; i < n; i++) actualizarCuadro(performance.now()); },
  get bufer() { return bufer; }, caballeros,
  // para pruebas controladas de fluidez: snapshots sintéticos con hora de llegada simulada
  prueba: { recibir, actualizarCuadro, vaciarBufer, limpiarEntidades },
};
</script>
